name: Trainer Nightly Remote-SSH E2E

# §十 Layer 1 + Layer 2: nightly remote-SSH verification.
#
# Layer 1 (robotic): runs the transport E2E against a real localhost sshd
# (exec, byte-exact read, search, sha256 hashing, verification pass/fail,
# interrupted-run outcome-unknown, reconnect) plus the shipped-source
# integrity and full server suites as a regression floor.
#
# Layer 2 (manual, instrumented): a human inside a real Remote-SSH
# VS Code Server window cannot be asserted robotically in CI, so every run
# PRODUCES what that human needs:
#   * the packaged extension VSIX artifacts (trainer-remote-ssh-l2-vsix)
#   * a generated bilingual L2 manual acceptance checklist
#     (trainer-remote-ssh-l2-manual-checklist)
#   * a run summary linking both artifacts
# The human executes the checklist and pastes it (or screenshots) back as
# evidence (docs/remote-ssh-acceptance.md).
#
# Layer 3 (full VS Code Server remote-window journey asserted by machines)
# still requires Remote-SSH + VS Code Server infrastructure and remains a
# manual acceptance target (docs/remote-ssh-acceptance.md).

on:
  schedule:
    # 04:00 UTC daily
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-remote-ssh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  remote-ssh-e2e:
    name: Remote-SSH E2E (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            extension/package-lock.json
            extension/webview/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/pyproject.toml

      - name: Bootstrap with the portable lifecycle
        run: npm run bootstrap -- --frozen

      - name: Build with the portable lifecycle
        run: npm run dev -- --skip-install

      - name: Generate the L2 manual acceptance checklist (§十)
        run: |
          mkdir -p artifacts
          node scripts/generate-remote-ssh-l2-checklist.mjs \
            --out artifacts/remote-ssh-l2-manual-checklist.md \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Install Playwright test runner (root dev dependency)
        run: npm install --no-save --prefix . "@playwright/test@^1.61.0" "playwright@^1.61.0"

      - name: TypeScript and CSS section gate
        run: npm run check


      - name: Remote-SSH transport E2E (§十 Layer 1)
        run: npm run test:remote-ssh-e2e

      - name: Package the extension VSIX for the L2 manual pass
        run: npm run package:vsix

      - name: Upload L2 VSIX artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trainer-remote-ssh-l2-vsix
          path: extension/*.vsix
          if-no-files-found: error

      - name: Upload the L2 manual acceptance checklist
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trainer-remote-ssh-l2-manual-checklist
          path: artifacts/remote-ssh-l2-manual-checklist.md
          if-no-files-found: error

      - name: Shipped-source integrity gate
        working-directory: server
        run: |
          .venv/bin/python -m pytest tests/test_provider_source_integrity.py -q --tb=short

      - name: Extension tests
        run: npm run test:extension

      - name: Install Chromium for the preview experience matrix
        run: npm exec --yes --package playwright -- playwright install --with-deps chromium

      - name: 200-scenario preview experience matrix
        run: npm run test:experience-matrix

      - name: Write the L2 acceptance summary
        if: always()
        run: |
          {
            echo "## §十 Layer 2 — Remote-SSH nightly manual acceptance"
            echo ""
            echo "Layer 1 (transport E2E over real localhost sshd) ran robotically above."
            echo "Layer 2 (human inside a Remote-SSH VS Code Server window) is instrumented"
            echo "by this run's artifacts:"
            echo ""
            echo "| Artifact | Contents |"
            echo "| --- | --- |"
            echo "| \`trainer-remote-ssh-l2-vsix\` | Packaged extension VSIX(s) to install in the Remote-SSH window (\`extension/*.vsix\`) |"
            echo "| \`trainer-remote-ssh-l2-manual-checklist\` | Bilingual zh-CN/en-US click-path checklist with per-step expected outcomes and a blank pass/fail column |"
            echo ""
            echo "Both artifacts are listed under this run's **Artifacts** section:"
            echo "<${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}>"
            echo ""
            echo "Execute the checklist in a Remote-SSH window and paste it (or screenshots)"
            echo "back as evidence — see docs/remote-ssh-acceptance.md."
          } >> "$GITHUB_STEP_SUMMARY"

  server-regression:
    name: Server regression (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/pyproject.toml

      - name: Create python environment
        working-directory: server
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install -U pip
          pip install -e ".[dev]"

      - name: Server tests
        working-directory: server
        env:
          PYTHONUTF8: "1"
        run: |
          set -o pipefail
          .venv/bin/python -m pytest tests/ -q --tb=short --durations=10 2>&1 | tail -20

      - name: Ruff (server)
        working-directory: server
        run: .venv/bin/python -m ruff check app tests

      - name: Pyright (server)
        working-directory: server
        run: .venv/bin/python -m pyright app
