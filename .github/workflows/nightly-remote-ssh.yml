name: Trainer Nightly Remote-SSH E2E

# §十 Layer 2: nightly remote-SSH integration verification.
#
# Runs the Layer 1 transport E2E (real localhost sshd: exec, byte-exact
# read, search, sha256 hashing, verification pass/fail, interrupted-run
# outcome-unknown, reconnect) plus the shipped-source integrity and full
# server suites as a regression floor.
#
# Layer 3 (VS Code Server remote-window journey: companion install →
# capability handshake → training attempt → evidence → reconnect through
# the actual VS Code UI) requires the Remote-SSH extension + VS Code
# Server infrastructure and remains a manual acceptance target
# (docs/remote-ssh-acceptance.md).

on:
  schedule:
    # 04:00 UTC daily
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-remote-ssh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  remote-ssh-e2e:
    name: Remote-SSH E2E (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            extension/package-lock.json
            extension/webview/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/pyproject.toml

      - name: Bootstrap with the portable lifecycle
        run: npm run bootstrap -- --frozen

      - name: Build with the portable lifecycle
        run: npm run dev -- --skip-install

      - name: Install Playwright test runner (root dev dependency)
        run: npm install --no-save --prefix . "@playwright/test@^1.61.0" "playwright@^1.61.0"

      - name: TypeScript and CSS section gate
        run: npm run check

      - name: Remote-SSH transport E2E (§十)
        run: npm run test:remote-ssh-e2e

      - name: Shipped-source integrity gate
        working-directory: server
        run: |
          .venv/bin/python -m pytest tests/test_provider_source_integrity.py -q --tb=short

      - name: Extension tests
        run: npm run test:extension

      - name: 200-scenario preview experience matrix
        run: npm run test:experience-matrix

  server-regression:
    name: Server regression (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/pyproject.toml

      - name: Create python environment
        working-directory: server
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install -U pip
          pip install -e ".[dev]"

      - name: Server tests
        working-directory: server
        env:
          PYTHONUTF8: "1"
        run: |
          set -o pipefail
          .venv/bin/python -m pytest tests/ -q --tb=short --durations=10 2>&1 | tail -20

      - name: Ruff (server)
        working-directory: server
        run: .venv/bin/python -m ruff check app tests

      - name: Pyright (server)
        working-directory: server
        run: .venv/bin/python -m pyright app
