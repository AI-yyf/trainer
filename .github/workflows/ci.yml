name: ci

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up locked Python tooling
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.10"

      - name: Create python environment from the lock
        working-directory: server
        run: uv sync --frozen --extra dev --extra build --python 3.12

      - name: Install node dependencies
        run: npm ci

      - name: Ruff (server)
        working-directory: server
        run: |
          . .venv/bin/activate
          ruff check app tests

      - name: TypeScript (webview + extension)
        run: npm run check

      - name: Product version gate
        run: npm run verify:version

      - name: Pyright (server)
        working-directory: server
        run: .venv/bin/python -m pyright app

      - name: Build
        run: npm run build

      - name: Extension tests
        run: |
          npm run test:extension 2>&1 | tee extension-test.log
          exit ${PIPESTATUS[0]}

      - name: Expose failing tests in step summary
        if: failure()
        run: |
          {
            echo "### Failing node:test cases"
            grep -aE "^✖|^not ok " extension-test.log | head -60
            grep -aB1 -A14 "^✖" extension-test.log | head -160
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Server tests (full)
        working-directory: server
        run: |
          . .venv/bin/activate
          python -m pytest tests -q --tb=short
