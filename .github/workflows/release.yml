name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }} → ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win32-x64
            py: "3.12"
          - os: macos-latest
            target: darwin-arm64
            py: "3.12"
          - os: ubuntu-latest
            target: linux-x64
            py: "3.12"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Python env for the sidecar + PyInstaller binary build.
      - name: Set up locked Python tooling
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.10"

      - name: Create python environment from the lock
        working-directory: server
        run: uv sync --frozen --extra dev --extra build --python 3.12

      - name: Install node dependencies
        run: npm ci

      - name: Product and tag version gate
        run: npm run verify:version

      - name: Python lint and types
        working-directory: server
        run: |
          PYTHON=".venv/bin/python"
          if [ "$RUNNER_OS" = "Windows" ]; then PYTHON=".venv/Scripts/python.exe"; fi
          "$PYTHON" -m ruff check app tests
          "$PYTHON" -m pyright app

      - name: TypeScript and CSS gate
        run: npm run check

      - name: Build webview + extension
        run: npm run build

      # Extension tests run BEFORE packaging: the deterministic vsix build
      # strips the browserSidecar test entry, so tests must see the
      # development webview build (which keeps it).
      - name: Extension test suite
        run: npm run test:extension

      - name: Package VSIX (${{ matrix.target }})
        id: package-vsix
        run: npm run package:vsix --prefix extension

      # Per-OS adaptation proof: the frozen binary must run on the OS it was
      # built for. This is the packaged artifact users actually execute.
      - name: Smoke frozen sidecar binary
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            BIN="extension/bundled/bin/win32-x64/trainer-sidecar.exe"
          else
            BIN="extension/bundled/bin/${{ matrix.target }}/trainer-sidecar"
            chmod +x "$BIN"
          fi
          "$BIN" --help

      - name: Collect npm debug logs
        if: failure()
        run: |
          mkdir -p npm-debug-logs
          cp -r "C:/npm/cache/_logs/." npm-debug-logs/ 2>/dev/null || true
          cp -r /home/runner/.npm/_logs/. npm-debug-logs/ 2>/dev/null || true
          cp -r /Users/runner/.npm/_logs/. npm-debug-logs/ 2>/dev/null || true

      - name: Upload npm debug logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: npm-logs-${{ matrix.target }}
          path: npm-debug-logs/
          if-no-files-found: ignore

      - name: Server test suite (all release platforms, blocking)
        working-directory: server
        env:
          PYTHONUTF8: "1"
        run: |
          PYTHON=".venv/bin/python"
          if [ "$RUNNER_OS" = "Windows" ]; then PYTHON=".venv/Scripts/python.exe"; fi
          set -o pipefail
          "$PYTHON" -m pytest tests -q --tb=short 2>&1 | tee pytest-platform.log

      - name: Install browser acceptance dependencies
        run: npm install --no-save --ignore-scripts "@playwright/test@1.62.1"

      - name: Install Chromium (Linux)
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium (macOS and Windows)
        if: runner.os != 'Linux'
        run: npx playwright install chromium

      - name: Browser teaching journey gate
        run: npm run test:experience-matrix

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: trainer-extension-${{ matrix.target }}
          path: |
            ${{ steps.package-vsix.outputs.vsix_path }}
            ${{ steps.package-vsix.outputs.vsix_metadata_path }}
          if-no-files-found: error

      - name: Upload platform pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-${{ matrix.target }}
          path: server/pytest-platform.log
          if-no-files-found: ignore

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download all VSIX artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: trainer-extension-*
          merge-multiple: true

      - name: Verify exact release artifacts and provenance
        run: node scripts/verify-release-artifacts.mjs --dir artifacts --ref "$GITHUB_REF" --commit "$GITHUB_SHA"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Trainer ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/*.vsix
            artifacts/*.vsix.build.json
