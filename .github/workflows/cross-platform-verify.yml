name: Trainer Cross-Platform Verify

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_vsix_host_e2e:
        description: Run the installed VSIX host E2E and fail if this runner cannot support it.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    env:
      OPENAI_API_KEY: ""
      TRAINER_PROVIDER_SMOKE_API_KEY: ${{ secrets.TRAINER_PROVIDER_SMOKE_API_KEY }}
      TRAINER_PROVIDER_SMOKE_BASE_URL: ${{ secrets.TRAINER_PROVIDER_SMOKE_BASE_URL }}
      TRAINER_PROVIDER_SMOKE_MODEL: ${{ secrets.TRAINER_PROVIDER_SMOKE_MODEL }}
      TRAINER_TURN_SMOKE_PROVIDER_API_KEY: ""
      TRAINER_TRAINING_RETURN_SMOKE_PROVIDER_API_KEY: ""

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            extension/package-lock.json
            extension/webview/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/pyproject.toml

      - name: Bootstrap with the portable lifecycle
        run: npm run bootstrap -- --frozen

      - name: Build with the portable lifecycle
        run: npm run dev -- --skip-install

      - name: Install Chromium for recovery verification (Linux)
        if: runner.os == 'Linux'
        run: npm exec --yes --package playwright -- playwright install --with-deps chromium

      - name: Install Chromium for recovery verification (macOS and Windows)
        if: runner.os != 'Linux'
        run: npm exec --yes --package playwright -- playwright install chromium

      - name: Run the 200-scenario preview experience matrix
        run: npm run test:experience-matrix

      - name: Run the 200-scenario real sidecar experience matrix
        run: npm run test:experience-sidecar

      - name: Verify browser recovery on the native runner
        run: npm run verify:webview-recovery --prefix extension

      - name: Clear inherited sidecar binaries before native packaging
        run: >-
          node -e "require('node:fs').rmSync('extension/bundled/bin', { recursive: true, force: true })"

      - name: Build and verify a native VSIX delivery artifact
        id: package-vsix
        run: npm run package:vsix

      - name: Archive the target-specific native VSIX
        uses: actions/upload-artifact@v4
        with:
          name: trainer-vsix-${{ steps.package-vsix.outputs.vsix_target }}
          path: ${{ steps.package-vsix.outputs.vsix_path }}
          if-no-files-found: error
          retention-days: 7

      - name: Detect native VSIX install and host-E2E capability
        id: vsix-capability
        run: node ./scripts/vsix-ci-capability.mjs

      - name: Verify native VSIX installation in VS Code
        if: ${{ steps.vsix-capability.outputs.install_available == 'true' }}
        run: node extension/scripts/verify-vsix-install.mjs

      - name: Record the native VSIX install manual gate
        if: ${{ steps.vsix-capability.outputs.install_available != 'true' }}
        run: node ./scripts/vsix-ci-capability.mjs --manual-install-gate

      # A skipped host E2E is recorded as a release gate, never as evidence of a pass.
      - name: Require the requested installed VSIX host E2E capability
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_vsix_host_e2e == true && steps.vsix-capability.outputs.host_e2e_available != 'true' }}
        run: node ./scripts/vsix-ci-capability.mjs --require-host-e2e

      - name: Run installed VSIX host E2E (Linux display)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_vsix_host_e2e == true && steps.vsix-capability.outputs.host_e2e_available == 'true' && steps.vsix-capability.outputs.linux_use_xvfb != 'true' && runner.os == 'Linux' }}
        run: npm run test:vsix-e2e

      - name: Run installed VSIX host E2E (Linux Xvfb)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_vsix_host_e2e == true && steps.vsix-capability.outputs.linux_use_xvfb == 'true' && runner.os == 'Linux' }}
        run: xvfb-run --auto-servernum npm run test:vsix-e2e

      - name: Run installed VSIX host E2E (macOS and Windows)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_vsix_host_e2e == true && steps.vsix-capability.outputs.host_e2e_available == 'true' && runner.os != 'Linux' }}
        run: npm run test:vsix-e2e

      - name: Record the installed VSIX host E2E manual gate
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.run_vsix_host_e2e == true) }}
        run: node ./scripts/vsix-ci-capability.mjs --manual-host-e2e-gate

      - name: Probe portable readiness
        run: npm run smoke

      - name: Verify workspace
        run: npm run verify

      - name: Run credential-gated provider smoke
        if: ${{ env.TRAINER_PROVIDER_SMOKE_API_KEY != '' && env.TRAINER_PROVIDER_SMOKE_BASE_URL != '' && env.TRAINER_PROVIDER_SMOKE_MODEL != '' }}
        run: npm run smoke:provider
