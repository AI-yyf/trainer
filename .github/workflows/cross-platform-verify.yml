name: Trainer Cross-Platform Verify

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_vsix_host_e2e:
        description: Run the installed VSIX host E2E and fail if this runner cannot support it.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: cross-platform-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job A — Core / Server: the Slow Slice lives here alone so a slow or
  # hung platform-specific server test cannot starve UI and package signal.
  server:
    name: Server (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Windows is the known long pole: 2951 tests measured at 57m42s serial;
    # xdist makes it WORSE on the 2-core runner (-n 4 and -n 2 both missed
    # the window — process/IPC overhead swamps the parallel gain). Serial +
    # 75 minutes is the measured-honest configuration; shrinking the slow
    # coach-turn slice is the real fix and stays on the roadmap (§五).
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    env:
      OPENAI_API_KEY: ""
      TRAINER_PROVIDER_SMOKE_API_KEY: ${{ secrets.TRAINER_PROVIDER_SMOKE_API_KEY }}
      TRAINER_PROVIDER_SMOKE_BASE_URL: ${{ secrets.TRAINER_PROVIDER_SMOKE_BASE_URL }}
      TRAINER_PROVIDER_SMOKE_MODEL: ${{ secrets.TRAINER_PROVIDER_SMOKE_MODEL }}
      TRAINER_TURN_SMOKE_PROVIDER_API_KEY: ""
      TRAINER_TRAINING_RETURN_SMOKE_PROVIDER_API_KEY: ""
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/uv.lock

      - name: Set up locked Python tooling
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.10"

      - name: Create python environment from the lock
        working-directory: server
        run: uv sync --frozen --extra dev --extra build --python 3.12

      - name: Server tests (slowest slice, isolated here)
        working-directory: server
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: |
          PYTHON=".venv/bin/python"
          if [ "$RUNNER_OS" = "Windows" ]; then
            PYTHON=".venv/Scripts/python.exe"
          fi
          set -o pipefail
          "$PYTHON" -m pytest tests/ -q --tb=short --durations=25 2>&1 | tail -45

      - name: Remote-SSH transport E2E (§十 layer 1, Linux only)
        if: runner.os == 'Linux'
        run: npm run test:remote-ssh-e2e

      - name: Ruff (server)
        working-directory: server
        shell: bash
        run: |
          PYTHON=".venv/bin/python"
          if [ "$RUNNER_OS" = "Windows" ]; then
            PYTHON=".venv/Scripts/python.exe"
          fi
          "$PYTHON" -m ruff check app tests

      # Type checking is platform-independent; windows spends its budget on
      # the 50-minute serial pytest slice instead (§五).
      - name: Pyright (server)
        if: runner.os == 'Linux'
        working-directory: server
        run: |
          PYTHON=".venv/bin/python"
          "$PYTHON" -m pyright app

  # Job B — UI / Experience: webview build, unit guards, the 200-scenario
  # preview matrix and browser recovery.
  ui:
    name: UI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            extension/package-lock.json
            extension/webview/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up locked Python tooling
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.10"

      - name: Bootstrap with the portable lifecycle
        run: npm run bootstrap -- --frozen

      - name: Product version gate
        run: npm run verify:version

      - name: Build with the portable lifecycle
        run: npm run dev -- --skip-install

      - name: TypeScript and CSS section gate
        run: npm run check

      - name: Extension tests
        run: npm run test:extension

      - name: Install Chromium for recovery verification (Linux)
        if: runner.os == 'Linux'
        run: npm exec --yes --package playwright@1.62.1 -- playwright install --with-deps chromium

      - name: Install Chromium for recovery verification (macOS and Windows)
        if: runner.os != 'Linux'
        run: npm exec --yes --package playwright@1.62.1 -- playwright install chromium

      - name: Install Playwright test runner (root dev dependency)
        run: npm install --no-save --ignore-scripts --prefix . "@playwright/test@1.62.1" "playwright@1.62.1"

      - name: Run the 200-scenario preview experience matrix
        run: npm run test:experience-matrix

      - name: Run the 200-scenario real sidecar experience matrix
        run: npm run test:experience-sidecar

      - name: Verify browser recovery on the native runner
        run: npm run verify:webview-recovery --prefix extension

  # Job C — Package / Delivery: native sidecar, remote companion, VSIX,
  # package verification and the portable smoke.
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    env:
      OPENAI_API_KEY: ""
      TRAINER_PROVIDER_SMOKE_API_KEY: ${{ secrets.TRAINER_PROVIDER_SMOKE_API_KEY }}
      TRAINER_PROVIDER_SMOKE_BASE_URL: ${{ secrets.TRAINER_PROVIDER_SMOKE_BASE_URL }}
      TRAINER_PROVIDER_SMOKE_MODEL: ${{ secrets.TRAINER_PROVIDER_SMOKE_MODEL }}
      TRAINER_TURN_SMOKE_PROVIDER_API_KEY: ""
      TRAINER_TRAINING_RETURN_SMOKE_PROVIDER_API_KEY: ""
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            extension/package-lock.json
            extension/webview/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/uv.lock

      - name: Set up locked Python tooling
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.10"

      - name: Bootstrap with the portable lifecycle
        run: npm run bootstrap -- --frozen

      - name: Product version gate
        run: npm run verify:version

      - name: Build with the portable lifecycle
        run: npm run dev -- --skip-install

      - name: Sync locked native build dependencies
        run: uv sync --project server --frozen --extra dev --extra build --python 3.12

      - name: Build and verify a native VSIX delivery artifact
        id: package-vsix
        run: npm run package:vsix

      - name: Archive the target-specific native VSIX
        uses: actions/upload-artifact@v4
        with:
          name: trainer-vsix-${{ matrix.os }}-${{ steps.package-vsix.outputs.vsix_target }}
          path: |
            ${{ steps.package-vsix.outputs.vsix_path }}
            ${{ steps.package-vsix.outputs.vsix_metadata_path }}
          if-no-files-found: error
          retention-days: 7

      - name: Detect native VSIX install and host-E2E capability
        id: vsix-capability
        run: node ./scripts/vsix-ci-capability.mjs

      - name: Verify native VSIX installation in VS Code
        if: ${{ steps.vsix-capability.outputs.install_available == 'true' }}
        run: node extension/scripts/verify-vsix-install.mjs

      - name: Record the native VSIX install manual gate
        if: ${{ steps.vsix-capability.outputs.install_available != 'true' }}
        run: node ./scripts/vsix-ci-capability.mjs --manual-install-gate

      # A skipped host E2E is recorded as a release gate, never as evidence of a pass.
      - name: Require the requested installed VSIX host E2E capability
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_vsix_host_e2e == true && steps.vsix-capability.outputs.host_e2e_available != 'true' }}
        run: node ./scripts/vsix-ci-capability.mjs --require-host-e2e

      - name: Run installed VSIX host E2E (Linux display)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_vsix_host_e2e == true && steps.vsix-capability.outputs.host_e2e_available == 'true' && steps.vsix-capability.outputs.linux_use_xvfb != 'true' && runner.os == 'Linux' }}
        run: npm run test:vsix-e2e

      - name: Run installed VSIX host E2E (Linux Xvfb)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_vsix_host_e2e == true && steps.vsix-capability.outputs.linux_use_xvfb == 'true' && runner.os == 'Linux' }}
        run: xvfb-run --auto-servernum npm run test:vsix-e2e

      - name: Run installed VSIX host E2E (macOS and Windows)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_vsix_host_e2e == true && steps.vsix-capability.outputs.host_e2e_available == 'true' && runner.os != 'Linux' }}
        run: npm run test:vsix-e2e

      - name: Record the installed VSIX host E2E manual gate
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.run_vsix_host_e2e == true) }}
        run: node ./scripts/vsix-ci-capability.mjs --manual-host-e2e-gate

      - name: Probe portable readiness
        run: npm run smoke

      - name: Run credential-gated provider smoke
        if: ${{ env.TRAINER_PROVIDER_SMOKE_API_KEY != '' && env.TRAINER_PROVIDER_SMOKE_BASE_URL != '' && env.TRAINER_PROVIDER_SMOKE_MODEL != '' }}
        run: npm run smoke:provider
