<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Trainer Capture</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <!--
      en-US fallback text only; popup.js localizes via the shared copy map.
      Two states: pairing (first run) and capture. No connection status, no
      import history — captures land in Trainer and the badge carries the
      queued count. Words live in tooltips; the card stays quiet like a menu.
    -->

    <svg class="sprite" aria-hidden="true" focusable="false" width="0" height="0">
      <defs>
        <symbol id="icon-plus" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 4.6v10.8M4.6 10h10.8" />
        </symbol>
        <symbol id="icon-download" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 3.6v8.6" /><path d="M6.7 9l3.3 3.3L13.3 9" /><path d="M4 15.9h12" />
        </symbol>
        <symbol id="icon-refresh" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16.3 9.2a6.3 6.3 0 1 0-1.6 4.6" /><path d="M16.6 4.9v4.3h-4.3" />
        </symbol>
        <symbol id="icon-external" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11.4 4.4h4.2v4.2" /><path d="M15.6 4.4 9.8 10.2" /><path d="M14.6 11.7v3.2a1.3 1.3 0 0 1-1.3 1.3H5.1a1.3 1.3 0 0 1-1.3-1.3V6.7a1.3 1.3 0 0 1 1.3-1.3h3.2" />
        </symbol>
        <symbol id="icon-plug" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7.2 3.6v3.1M12.8 3.6v3.1" /><path d="M5.4 6.7h9.2v2a4.6 4.6 0 0 1-9.2 0z" /><path d="M10 13.3v3.1" />
        </symbol>
        <symbol id="icon-folder-check" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3.8 6.2a1.3 1.3 0 0 1 1.3-1.3h2.3l1.4 1.6h5.1a1.3 1.3 0 0 1 1.3 1.3v6.7a1.3 1.3 0 0 1-1.3 1.3H5.1a1.3 1.3 0 0 1-1.3-1.3z" /><path d="M8.1 11.3l1.4 1.4 2.6-3" />
        </symbol>
        <symbol id="icon-target" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="10" cy="10" r="6.3" /><circle cx="10" cy="10" r="2.3" />
        </symbol>
        <symbol id="icon-unlink" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8.4 11.6 11.6 8.4" /><path d="M9.3 6.2l1.2-1.2a2.7 2.7 0 0 1 3.8 3.8l-1.2 1.2" /><path d="M10.7 13.8l-1.2 1.2a2.7 2.7 0 0 1-3.8-3.8l1.2-1.2" />
        </symbol>
        <symbol id="icon-check" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path class="check-path" d="M4.9 10.4l3.3 3.3 6.9-7.4" />
        </symbol>
        <symbol id="icon-close" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5.4 5.4l9.2 9.2M14.6 5.4l-9.2 9.2" />
        </symbol>
      </defs>
    </svg>

    <main class="card">
      <button id="popup-close" class="iconbtn card-close" type="button" data-copy-label="close">
        <svg class="icon icon--xs" aria-hidden="true"><use href="#icon-close"></use></svg>
        <span class="visually-hidden" data-copy="close">Close</span>
      </button>

      <section id="pair-panel" class="panel" hidden>
        <h1 class="card-title" data-copy="pairHeading"></h1>
        <p id="detect-line" class="muted-line" data-copy="detecting"></p>
        <div class="row">
          <input id="pair-code" type="text" inputmode="numeric" autocomplete="one-time-code"
            spellcheck="false" maxlength="7" data-copy-placeholder="pairCodePlaceholder"
            data-copy-title="pairCodeHint" />
          <button id="pair-submit" class="iconbtn iconbtn--solid" type="button" data-copy-label="pairAction">
            <svg class="icon" aria-hidden="true"><use href="#icon-plug"></use></svg>
            <span class="visually-hidden" data-copy="pairAction">Pair</span>
          </button>
        </div>
        <div class="row row--tight">
          <button id="detect-again" class="iconbtn" type="button" data-copy-label="detectAgain">
            <svg class="icon icon--xs" aria-hidden="true"><use href="#icon-refresh"></use></svg>
            <span class="visually-hidden" data-copy="detectAgain">Detect again</span>
          </button>
          <p id="pair-feedback" class="feedback" role="status" aria-live="polite"></p>
        </div>
      </section>

      <section id="capture-panel" class="panel" hidden>
        <h1 class="card-title" data-copy="captureHeading"></h1>
        <button id="capture-page" class="row row--action" type="button">
          <span id="page-line" class="row__title"></span>
          <svg class="icon row__plus" aria-hidden="true"><use href="#icon-plus"></use></svg>
        </button>
        <p id="capture-result" class="feedback" role="status" aria-live="polite"></p>
        <select id="focus-select" class="select" data-copy-label="bindingLabel" data-copy-title="bindingHint"></select>

        <div id="download-block" class="dl" hidden>
          <input id="target-dir" type="text" spellcheck="false" autocomplete="off"
            data-copy-placeholder="downloadPlaceholder" data-copy-title="downloadHint" />
          <button id="capture-download" class="iconbtn" type="button" data-copy-label="downloadAction">
            <svg class="icon icon--xs" aria-hidden="true"><use href="#icon-folder-check"></use></svg>
            <span class="visually-hidden" data-copy="downloadAction">Download to project folder</span>
          </button>
        </div>
        <p id="download-feedback" class="feedback" role="status" aria-live="polite" hidden></p>
      </section>

      <footer class="foot">
        <button id="open-trainer" class="pill" type="button">
          <svg class="icon icon--xs" aria-hidden="true"><use href="#icon-external"></use></svg>
          <span data-copy="openTrainer">Open Trainer</span>
        </button>
        <span class="foot__spacer"></span>
        <button id="revoke" class="iconbtn" type="button" data-copy-label="pairRevoke">
          <svg class="icon icon--xs" aria-hidden="true"><use href="#icon-unlink"></use></svg>
          <span class="visually-hidden" data-copy="pairRevoke">Revoke pairing</span>
        </button>
      </footer>
      <p id="notice" class="feedback feedback--error" role="status" aria-live="polite" hidden></p>
    </main>

    <script src="../shared.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
