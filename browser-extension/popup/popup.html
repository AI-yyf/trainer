<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Trainer Capture</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <!--
      The visible text below is the en-US fallback only: popup.js applies
      data-copy / data-copy-placeholder through the shared copy map for all
      eight supported languages right after DOMContentLoaded.

      Three states, one popup (task 三):
        1. unpaired        → #pair-panel
        2. paired, Trainer not running → #offline-panel (status card) plus the
           full queue manager (#queue-panel) — capturing keeps working and
           queues locally
        3. connected       → #connected-panel (workspace + library count) and
           the recent captures list (#history-panel)
      The capture panel is shared by states 2 and 3, so every capture entry and
      the download-to-project-folder entry stay reachable while Trainer is down.
    -->

    <!-- Inline icon sprite: stroke 1.7, round caps/joins, one Trainer icon grammar. -->
    <svg class="sprite" aria-hidden="true" focusable="false" width="0" height="0">
      <defs>
        <symbol id="icon-plus" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 4.6v10.8M4.6 10h10.8" />
        </symbol>
        <symbol id="icon-download" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 3.6v8.6" />
          <path d="M6.7 9l3.3 3.3L13.3 9" />
          <path d="M4 15.9h12" />
        </symbol>
        <symbol id="icon-refresh" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16.3 9.2a6.3 6.3 0 1 0-1.6 4.6" />
          <path d="M16.6 4.9v4.3h-4.3" />
        </symbol>
        <symbol id="icon-trash" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4.4 6.3h11.2" />
          <path d="M8 6.3V4.9a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v1.4" />
          <path d="M6.1 6.3l.7 8.5a1.3 1.3 0 0 0 1.3 1.2h3.8a1.3 1.3 0 0 0 1.3-1.2l.7-8.5" />
        </symbol>
        <symbol id="icon-external" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11.4 4.4h4.2v4.2" />
          <path d="M15.6 4.4 9.8 10.2" />
          <path d="M14.6 11.7v3.2a1.3 1.3 0 0 1-1.3 1.3H5.1a1.3 1.3 0 0 1-1.3-1.3V6.7a1.3 1.3 0 0 1 1.3-1.3h3.2" />
        </symbol>
        <symbol id="icon-cloud-off" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6.6 14.9h8a3.2 3.2 0 0 0 .8-6.3 4.6 4.6 0 0 0-6.5-3.9" />
          <path d="M8 5.6a4.6 4.6 0 0 0-2.3 7.2" />
          <path d="M4.6 15.4 15.4 4.6" />
        </symbol>
        <symbol id="icon-plug" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7.2 3.6v3.1M12.8 3.6v3.1" />
          <path d="M5.4 6.7h9.2v2a4.6 4.6 0 0 1-9.2 0z" />
          <path d="M10 13.3v3.1" />
        </symbol>
        <symbol id="icon-file-text" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11.6 3.5H6.3A1.3 1.3 0 0 0 5 4.8v10.4a1.3 1.3 0 0 0 1.3 1.3h7.4a1.3 1.3 0 0 0 1.3-1.3V6.9z" />
          <path d="M11.6 3.5v3.4H15" />
          <path d="M7.6 11.2h4.8M7.6 13.6h3.2" />
        </symbol>
        <symbol id="icon-file-pdf" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11.6 3.5H6.3A1.3 1.3 0 0 0 5 4.8v10.4a1.3 1.3 0 0 0 1.3 1.3h7.4a1.3 1.3 0 0 0 1.3-1.3V6.9z" />
          <path d="M11.6 3.5v3.4H15" />
          <path d="M7.7 13.7v-3h.9a.9.9 0 0 1 0 1.8h-.9" />
          <path d="M11.1 10.7h1.4v3h-1.4" />
        </symbol>
        <symbol id="icon-git-branch" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6.6 6.5v7" />
          <circle cx="6.6" cy="4.9" r="1.6" />
          <circle cx="6.6" cy="15.1" r="1.6" />
          <circle cx="13.4" cy="9.1" r="1.6" />
          <path d="M13.4 10.7c0 2-1.6 2.6-3.2 2.8" />
        </symbol>
        <symbol id="icon-folder-check" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3.8 6.2a1.3 1.3 0 0 1 1.3-1.3h2.3l1.4 1.6h5.1a1.3 1.3 0 0 1 1.3 1.3v6.7a1.3 1.3 0 0 1-1.3 1.3H5.1a1.3 1.3 0 0 1-1.3-1.3z" />
          <path d="M8.1 11.3l1.4 1.4 2.6-3" />
        </symbol>
        <symbol id="icon-target" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="10" cy="10" r="6.3" />
          <circle cx="10" cy="10" r="2.3" />
        </symbol>
        <symbol id="icon-unlink" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8.4 11.6 11.6 8.4" />
          <path d="M9.3 6.2l1.2-1.2a2.7 2.7 0 0 1 3.8 3.8l-1.2 1.2" />
          <path d="M10.7 13.8l-1.2 1.2a2.7 2.7 0 0 1-3.8-3.8l1.2-1.2" />
        </symbol>
        <symbol id="icon-check" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path class="check-path" d="M4.9 10.4l3.3 3.3 6.9-7.4" />
        </symbol>
      </defs>
    </svg>

    <main class="popup">
      <header class="header">
        <span class="brand" aria-hidden="true">
          <!-- Same mark as icons/icon*.png: indigo rounded square + gold geometric T. -->
          <svg viewBox="0 0 24 24" width="22" height="22" role="img">
            <rect x="0.75" y="0.75" width="22.5" height="22.5" rx="5.6" fill="#4338CA" />
            <path d="M7.3 8.5h9.4M12 8.5v7.6" fill="none" stroke="#F59E0B" stroke-width="2.4" stroke-linecap="round" />
            <circle cx="12" cy="18.4" r="1.05" fill="#F59E0B" />
          </svg>
        </span>
        <div class="header__text">
          <strong class="header__title" data-copy="appTitle">Trainer Capture</strong>
          <span class="status">
            <span id="status-dot" class="status__dot status__dot--pending" aria-hidden="true"></span>
            <span id="status-line" class="status__text" role="status" aria-live="polite" data-copy="checking"></span>
          </span>
        </div>
        <span id="queue-chip" class="chip" hidden>
          <svg class="icon icon--xs" aria-hidden="true"><use href="#icon-refresh"></use></svg>
          <span id="queue-chip-count">0</span>
        </span>
      </header>

      <section id="pair-panel" class="panel" hidden>
        <h2 class="panel__title" data-copy="pairHeading">Pairing</h2>
        <p id="detect-line" class="detect" data-copy="detecting"></p>
        <label class="field">
          <span class="field__label" data-copy="pairCodeLabel">Pairing code</span>
          <input
            id="pair-code"
            type="text"
            inputmode="numeric"
            autocomplete="one-time-code"
            spellcheck="false"
            maxlength="7"
            data-copy-placeholder="pairCodePlaceholder"
          />
        </label>
        <div class="actions">
          <button id="pair-submit" class="button button--primary" type="button" data-copy="pairAction">Pair</button>
          <button id="detect-again" class="button" type="button" data-copy="detectAgain">Detect again</button>
        </div>
        <p id="pair-feedback" class="feedback" role="status" aria-live="polite"></p>
        <p class="hint" data-copy="pairCodeHint"></p>
      </section>

      <section id="offline-panel" class="panel panel--status" hidden>
        <div class="state-card state-card--offline">
          <span class="state-card__icon">
            <svg class="icon" aria-hidden="true"><use href="#icon-cloud-off"></use></svg>
          </span>
          <div class="state-card__body">
            <strong class="state-card__title" data-copy="statusOffline"></strong>
            <p class="state-card__detail" data-copy="statusOfflineDetail"></p>
          </div>
        </div>
      </section>

      <section id="connected-panel" class="panel panel--status" hidden>
        <div class="state-card state-card--connected">
          <span class="state-card__icon">
            <svg class="icon" aria-hidden="true"><use href="#icon-plug"></use></svg>
          </span>
          <div class="state-card__body">
            <span class="state-card__row">
              <span class="state-card__label" data-copy="workspaceLabel"></span>
              <strong id="workspace-name" class="state-card__value"></strong>
            </span>
            <span id="library-count" class="state-card__meta"></span>
          </div>
        </div>
      </section>

      <section id="capture-panel" class="panel" hidden>
        <h2 class="panel__title" data-copy="captureHeading">Add to library</h2>
        <p id="page-line" class="page-line"></p>
        <label class="field">
          <span class="field__label field__label--icon">
            <svg class="icon icon--xs" aria-hidden="true"><use href="#icon-target"></use></svg>
            <span data-copy="bindingLabel">Bind a learning focus (optional)</span>
          </span>
          <select id="focus-select"></select>
        </label>
        <p class="hint" data-copy="bindingHint"></p>
        <div class="actions">
          <button id="capture-page" class="button button--primary" type="button">
            <svg class="icon" aria-hidden="true"><use href="#icon-plus"></use></svg>
            <span data-copy="capturePage">Add this page to the library</span>
          </button>
        </div>

        <div id="download-block" class="download" hidden>
          <h3 class="download__title">
            <svg class="icon icon--xs" aria-hidden="true"><use href="#icon-download"></use></svg>
            <span data-copy="downloadHeading"></span>
          </h3>
          <label class="field">
            <span class="field__label" data-copy="downloadLabel"></span>
            <input
              id="target-dir"
              type="text"
              spellcheck="false"
              autocomplete="off"
              data-copy-placeholder="downloadPlaceholder"
            />
          </label>
          <p class="hint" data-copy="downloadHint"></p>
          <div class="actions">
            <button id="capture-download" class="button" type="button">
              <svg class="icon" aria-hidden="true"><use href="#icon-folder-check"></use></svg>
              <span data-copy="downloadAction"></span>
            </button>
          </div>
          <p id="download-feedback" class="feedback" role="status" aria-live="polite"></p>
        </div>

        <p id="capture-result" class="feedback" role="status" aria-live="polite"></p>
      </section>

      <section id="queue-panel" class="panel" hidden>
        <div class="panel__head">
          <h2 class="panel__title" data-copy="queueHeading">Pending delivery</h2>
          <span id="queue-count" class="count"></span>
        </div>
        <ul id="queue-list" class="queue"></ul>
        <p id="queue-empty" class="queue__empty" data-copy="queueEmpty" hidden></p>
        <div class="actions actions--between">
          <button id="queue-retry" class="button button--small" type="button">
            <svg class="icon icon--xs" aria-hidden="true"><use href="#icon-refresh"></use></svg>
            <span data-copy="queueRetry">Retry now</span>
          </button>
          <button id="queue-clear" class="button button--small button--danger" type="button">
            <svg class="icon icon--xs" aria-hidden="true"><use href="#icon-trash"></use></svg>
            <span data-copy="queueClear"></span>
          </button>
        </div>
        <p id="queue-feedback" class="feedback" role="status" aria-live="polite"></p>
      </section>

      <section id="history-panel" class="panel" hidden>
        <h2 class="panel__title" data-copy="historyHeading">Recent captures</h2>
        <ul id="history-list" class="history"></ul>
      </section>

      <footer class="footer">
        <div class="actions actions--between">
          <button id="revoke" class="button button--ghost" type="button">
            <svg class="icon icon--xs" aria-hidden="true"><use href="#icon-unlink"></use></svg>
            <span data-copy="pairRevoke">Revoke pairing</span>
          </button>
          <button id="repair" class="button button--ghost" type="button" hidden data-copy="pairAgain">Pair again</button>
          <button id="open-trainer" class="button button--ghost" type="button">
            <svg class="icon icon--xs" aria-hidden="true"><use href="#icon-external"></use></svg>
            <span data-copy="openTrainer">Open Trainer</span>
          </button>
        </div>
        <p id="notice" class="feedback feedback--error" role="status" aria-live="polite" hidden></p>
      </footer>
    </main>

    <script src="../shared.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
