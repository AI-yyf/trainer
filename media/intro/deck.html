<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>Trainer — Intro Deck</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --ink:   #06060a;
    --ink2:  #0b0b11;
    --fg:    #f2f0ec;
    --mut:   #8f8b85;
    --gold:  #d9b273;
    --taupe: #9d907a;
    --teal:  #4ec9b0;
    --violet:#8b7cf6;
    --rose:  #f48771;
    --ui: -apple-system, "SF Pro Display", "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    --mono: "SF Mono", "JetBrains Mono", Menlo, Consolas, "Noto Sans Mono CJK SC", monospace;
  }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--ink); }
  body { font-family: var(--ui); color: var(--fg); -webkit-font-smoothing: antialiased; }

  #stage { position: absolute; inset: 0; overflow: hidden; }
  #bgcanvas { position: absolute; inset: 0; }
  #aurora { position: absolute; inset: -20%; pointer-events: none; }
  .aur {
    position: absolute; border-radius: 50%; filter: blur(120px); opacity: 0;
    will-change: transform, opacity;
  }

  /* vignette + grain */
  #vig { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 78% 68% at 50% 48%, transparent 40%, rgba(0,0,0,.55) 100%); }
  #grain { position: absolute; inset: 0; pointer-events: none; opacity: .045; mix-blend-mode: overlay; }

  .scene { position: absolute; inset: 0; will-change: opacity; }

  /* ---------- type ---------- */
  .h1 { font-size: 132px; font-weight: 800; letter-spacing: -0.045em; line-height: .95; }
  .h2 { font-size: 76px; font-weight: 750; letter-spacing: -0.035em; line-height: 1.05; }
  .h3 { font-size: 46px; font-weight: 700; letter-spacing: -0.028em; line-height: 1.15; }
  .lede { font-size: 27px; font-weight: 400; color: var(--mut); letter-spacing: .01em; line-height: 1.5; }
  .eyebrow { font-size: 15px; font-weight: 650; letter-spacing: .34em; color: var(--taupe); text-transform: uppercase; }
  .mono { font-family: var(--mono); }
  .gold { color: var(--gold); }
  .teal { color: var(--teal); }
  .rose { color: var(--rose); }
  .ch { display: inline-block; will-change: transform, opacity; }

  /* ---------- window ---------- */
  .win { position: absolute; will-change: transform, opacity; }
  .win-bar {
    height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 14px;
    background: linear-gradient(180deg, #1b1b22, #131318);
    border: 1px solid rgba(255,255,255,.09); border-bottom: none;
    border-radius: 14px 14px 0 0;
  }
  .win-bar i { width: 11px; height: 11px; border-radius: 50%; background: #3a3a44; display: block; }
  .win-bar i:nth-child(1) { background: #45343a; }
  .win-bar i:nth-child(2) { background: #3d3a2e; }
  .win-bar i:nth-child(3) { background: #2f3d3a; }
  .win-title { font-size: 12.5px; color: #7d7a76; margin-left: 8px; letter-spacing: .04em; font-family: var(--mono); }
  .win-body {
    position: relative; overflow: hidden; border: 1px solid rgba(255,255,255,.09);
    border-radius: 0 0 14px 14px; background: #0e0e13;
  }
  .win-body img { display: block; width: 100%; }
  .win-glow { position: absolute; inset: -14% -8%; border-radius: 50%; filter: blur(70px); z-index: -1; }

  /* ---------- chips / cards ---------- */
  .card {
    position: absolute; will-change: transform, opacity;
    background: linear-gradient(160deg, rgba(28,28,36,.92), rgba(15,15,20,.92));
    border: 1px solid rgba(255,255,255,.10); border-radius: 16px;
    box-shadow: 0 30px 80px -30px rgba(0,0,0,.9);
    backdrop-filter: blur(8px);
  }
  .chip {
    display: inline-flex; align-items: center; gap: 9px; padding: 9px 16px; border-radius: 999px;
    background: rgba(255,255,255,.045); border: 1px solid rgba(255,255,255,.10);
    font-size: 16px; color: #cfcbc5; will-change: transform, opacity;
  }
  .chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--gold); }
  .kbd { font-family: var(--mono); font-size: 15px; color: var(--mut); }

  /* code panel */
  .code {
    font-family: var(--mono); font-size: 16px; line-height: 1.75; color: #cfcbc5;
    white-space: pre; will-change: opacity;
  }
  .code .k { color: #c792ea; } .code .f { color: #82aaff; }
  .code .s { color: #c3e88d; } .code .n { color: #f78c6c; }
  .code .c { color: #5c6470; } .code .t { color: #ffcb6b; }

  .caret { display: inline-block; width: 9px; height: 20px; background: var(--gold); vertical-align: -3px; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="bgcanvas" width="1920" height="1080"></canvas>
  <div id="aurora">
    <div class="aur" id="aur1"></div>
    <div class="aur" id="aur2"></div>
    <div class="aur" id="aur3"></div>
  </div>
  <div id="vig"></div>
  <div id="grain"></div>
  <div class="scene" id="s-boot"></div>
  <div class="scene" id="s-problem"></div>
  <div class="scene" id="s-reveal"></div>
  <div class="scene" id="s-coach"></div>
  <div class="scene" id="s-plan"></div>
  <div class="scene" id="s-res"></div>
  <div class="scene" id="s-train"></div>
  <div class="scene" id="s-arch"></div>
  <div class="scene" id="s-scale"></div>
  <div class="scene" id="s-outro"></div>
</div>

<script>
/* =======================================================================
   Deterministic timeline. Everything is a pure function of t (seconds),
   so frame N always renders identically — required for frame-accurate
   capture. No CSS animations, no Math.random at draw time.
   ======================================================================= */
const W = 1920, H = 1080, FPS = 30, DURATION = 62.0;

const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp01((t - a) / (b - a));
const eOut = k => 1 - Math.pow(1 - k, 3);
const eIn = k => k * k * k;
const eIO = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const eExpo = k => k >= 1 ? 1 : 1 - Math.pow(2, -10 * k);
const eBack = k => { const c = 1.9; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
const sstep = (a, b, x) => { const k = clamp01((x - a) / (b - a)); return k * k * (3 - 2 * k); };
// enter (a→b) then exit (c→d) envelope
const env = (t, a, b, c, d) => sstep(a, b, t) * (1 - sstep(c, d, t));

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let x = Math.imul(a ^ a >>> 15, 1 | a);
    x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x;
    return ((x ^ x >>> 14) >>> 0) / 4294967296;
  };
}
const R = mulberry32(20260929);

/* ---------- deterministic particle field ---------- */
const NP = 78;
const parts = [];
for (let i = 0; i < NP; i++) {
  parts.push({
    x: R(), y: R(),
    vx: (R() - .5) * .012, vy: (R() - .5) * .012,
    r: .6 + R() * 1.7,
    h: R(),
    ph: R() * 6.283,
  });
}
const cv = document.getElementById('bgcanvas');
const cx = cv.getContext('2d');

function drawField(t, intensity) {
  cx.clearRect(0, 0, W, H);
  if (intensity <= 0.001) return;
  // perspective dot grid, drifting
  cx.save();
  cx.globalAlpha = .30 * intensity;
  cx.strokeStyle = 'rgba(157,144,122,0.13)';
  cx.lineWidth = 1;
  const off = (t * 9) % 64;
  for (let x = -64; x < W + 64; x += 64) {
    cx.beginPath(); cx.moveTo(x + off * .12, 0); cx.lineTo(x + off * .12, H); cx.stroke();
  }
  for (let y = -64; y < H + 64; y += 64) {
    cx.beginPath(); cx.moveTo(0, y); cx.lineTo(W, y); cx.stroke();
  }
  cx.restore();

  // drifting motes + constellation links
  const px = i => ((parts[i].x + parts[i].vx * t) % 1 + 1) % 1 * W;
  const py = i => ((parts[i].y + parts[i].vy * t) % 1 + 1) % 1 * H;
  cx.save();
  for (let i = 0; i < NP; i++) {
    for (let j = i + 1; j < NP; j++) {
      const dx = px(i) - px(j), dy = py(i) - py(j);
      const d2 = dx * dx + dy * dy;
      if (d2 < 46000) {
        const a = (1 - d2 / 46000) * .16 * intensity;
        cx.strokeStyle = `rgba(217,178,115,${a.toFixed(3)})`;
        cx.lineWidth = 1;
        cx.beginPath(); cx.moveTo(px(i), py(i)); cx.lineTo(px(j), py(j)); cx.stroke();
      }
    }
  }
  for (let i = 0; i < NP; i++) {
    const hue = parts[i].h;
    const col = hue < .5 ? '217,178,115' : hue < .82 ? '78,201,176' : '139,124,246';
    const a = (.20 + .35 * (0.5 + 0.5 * Math.sin(t * 1.5 + parts[i].ph))) * intensity;
    cx.fillStyle = `rgba(${col},${a.toFixed(3)})`;
    cx.beginPath(); cx.arc(px(i), py(i), parts[i].r, 0, 6.2832); cx.fill();
  }
  cx.restore();
}

/* ---------- film grain (static, generated once) ---------- */
(function grain() {
  const g = document.getElementById('grain');
  const c = document.createElement('canvas'); c.width = 240; c.height = 135;
  const x = c.getContext('2d');
  const id = x.createImageData(240, 135);
  const gr = mulberry32(7);
  for (let i = 0; i < id.data.length; i += 4) {
    const v = 120 + gr() * 135;
    id.data[i] = id.data[i+1] = id.data[i+2] = v; id.data[i+3] = 255;
  }
  x.putImageData(id, 0, 0);
  g.style.backgroundImage = `url(${c.toDataURL()})`;
})();

/* ---------- dom helpers ---------- */
const $ = s => document.querySelector(s);
const el = (tag, cls, html) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html != null) n.innerHTML = html;
  return n;
};
function chars(host, text, cls) {
  host.innerHTML = '';
  const out = [];
  for (const ch of text) {
    const s = el('span', 'ch' + (cls ? ' ' + cls : ''), ch === ' ' ? '&nbsp;' : ch);
    host.appendChild(s); out.push(s);
  }
  return out;
}
function setT(node, { o = 1, x = 0, y = 0, s = 1, r = 0, rz = 0, rx = 0, ry = 0, b = 0, sx = 1, sy = 1 } = {}) {
  let tr = '';
  if (x || y) tr += `translate3d(${x.toFixed(2)}px,${y.toFixed(2)}px,0) `;
  if (r) tr += `rotate(${r.toFixed(3)}deg) `;
  if (rz) tr += `rotateZ(${rz.toFixed(3)}deg) `;
  if (rx) tr += `rotateX(${rx.toFixed(3)}deg) `;
  if (ry) tr += `rotateY(${ry.toFixed(3)}deg) `;
  if (s !== 1) tr += `scale(${s.toFixed(4)}) `;
  if (sx !== 1 || sy !== 1) tr += `scale(${sx.toFixed(4)},${sy.toFixed(4)}) `;
  node.style.transform = tr || 'none';
  node.style.opacity = o;
  node.style.filter = b ? `blur(${b.toFixed(2)}px)` : 'none';
}
const hide = n => { n.style.opacity = 0; };

/* =======================================================================
   SCENES
   ======================================================================= */

/* ---------- S1 · BOOT  0 → 5.5 ---------- */
const boot = (() => {
  const root = $('#s-boot');
  const eb = el('div', 'eyebrow', 'TRAINER');
  eb.style.cssText = 'position:absolute;left:960px;top:250px;transform:translateX(-50%)';
  root.appendChild(eb);

  const word = el('div', 'h1');
  word.style.cssText = 'position:absolute;left:960px;top:322px;transform:translateX(-50%)';
  root.appendChild(word);
  const letters = chars(word, 'TRAINER');

  const rule = el('div', '');
  rule.style.cssText = 'position:absolute;left:960px;top:472px;height:2px;width:0;transform:translateX(-50%);background:linear-gradient(90deg,transparent,var(--gold),transparent);box-shadow:0 0 30px rgba(217,178,115,.7)';
  root.appendChild(rule);

  const sub = el('div', 'h3');
  sub.style.cssText = 'position:absolute;left:960px;top:520px;transform:translateX(-50%);color:#b9b4ac';
  root.appendChild(sub);
  const subChars = chars(sub, '对话式编程训练工作台');

  const sub2 = el('div', 'lede mono');
  sub2.style.cssText = 'position:absolute;left:960px;top:594px;transform:translateX(-50%);font-size:20px;letter-spacing:.10em;color:#6f6b66';
  sub2.textContent = 'VS Code EXTENSION  ·  LOCAL BRAIN  ·  REMOTE HANDS';
  root.appendChild(sub2);

  const ring = el('div', '');
  ring.style.cssText = 'position:absolute;left:960px;top:392px;width:560px;height:560px;margin:-280px 0 0 -280px;border-radius:50%;border:1px solid rgba(217,178,115,.16)';
  root.appendChild(ring);
  const ring2 = el('div', '');
  ring2.style.cssText = 'position:absolute;left:960px;top:392px;width:820px;height:820px;margin:-410px 0 0 -410px;border-radius:50%;border:1px solid rgba(217,178,115,.09)';
  root.appendChild(ring2);

  return function (t) {
    // letter scatter-in
    letters.forEach((n, i) => {
      const k = eExpo(seg(t, .35 + i * .085, 1.05 + i * .085));
      const sc = mulberry32(1000 + i);
      const ax = (sc() - .5) * 900, ay = (sc() - .5) * 460, ar = (sc() - .5) * 190;
      setT(n, {
        o: k,
        x: ax * (1 - k), y: ay * (1 - k) + (1 - k) * 40,
        r: ar * (1 - k), s: lerp(.6, 1, k), b: (1 - k) * 12,
      });
    });
    const kT = seg(t, .5, 1.4);
    setT(eb, { o: kT, y: (1 - eOut(kT)) * -14, b: (1 - kT) * 6 });

    const kR = eOut(seg(t, 1.0, 1.9));
    rule.style.width = (kR * 520).toFixed(1) + 'px';
    setT(rule, { o: .85 * kR });

    subChars.forEach((n, i) => {
      const k = eOut(seg(t, 1.7 + i * .045, 2.35 + i * .045));
      setT(n, { o: k, y: (1 - k) * 22, b: (1 - k) * 8 });
    });
    setT(sub2, { o: seg(t, 2.5, 3.3), y: (1 - eOut(seg(t, 2.5, 3.3))) * 16 });

    // rings breathe
    setT(ring, { o: .5 + .5 * .3, s: 1 + .06 * Math.sin(t * 1.1), r: t * 6 });
    setT(ring2, { o: 1, s: 1 + .05 * Math.sin(t * .8 + 1.4), r: -t * 4 });

    // whole-scene push-out at the end
    const out = seg(t, 4.7, 5.5);
    setT(root, { o: 1 - out, s: 1 + out * .18, b: out * 14 });
  };
})();

/* ---------- S2 · PROBLEM  5.5 → 12.0 ---------- */
const problem = (() => {
  const root = $('#s-problem');
  const eb = el('div', 'eyebrow', 'THE PROBLEM');
  eb.style.cssText = 'position:absolute;left:180px;top:196px';
  const head = el('div', 'h2');
  head.style.cssText = 'position:absolute;left:180px;top:240px';
  root.append(eb, head);
  const hc = chars(head, '学习是离散的');

  const items = [
    { t: '读文档', c: '#9d907a' }, { t: '刷题', c: '#8b7cf6' }, { t: '写代码', c: '#4ec9b0' },
    { t: '改需求', c: '#f48771' }, { t: '查资料', c: '#d9b273' },
  ];
  const nodes = items.map((it, i) => {
    const c = el('div', 'card');
    c.style.cssText = `left:0;top:0;width:236px;height:112px;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:700;letter-spacing:.02em;color:${it.c};border-color:${it.c}33`;
    c.textContent = it.t;
    root.appendChild(c);
    return c;
  });

  // snap lines between neighbours
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('width', W); svg.setAttribute('height', H);
  svg.style.cssText = 'position:absolute;inset:0';
  const lines = [];
  for (let i = 0; i < 4; i++) {
    const l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    l.setAttribute('stroke-dasharray', '7 9');
    svg.appendChild(l); lines.push(l);
  }
  root.appendChild(svg);

  const stats = [
    ['14', '个浏览器标签页'],
    ['37', '条收藏夹链接'],
    ['0', '次自动复习调度'],
  ].map(([v, l], i) => {
    const c = el('div', '');
    c.style.cssText = `position:absolute;left:${180 + i * 330}px;top:806px;width:300px`;
    c.innerHTML = `<div style="font-family:var(--mono);font-size:66px;font-weight:700;color:#5f5b57;line-height:1">${v}</div>
                   <div style="font-size:19px;color:#6f6b66;margin-top:12px">${l}</div>`;
    root.appendChild(c); return c;
  });

  const verdict = el('div', 'h3');
  verdict.style.cssText = 'position:absolute;left:180px;top:948px;color:var(--rose)';
  verdict.textContent = '知识记住了，但没有变成能力';
  root.appendChild(verdict);

  // layout targets
  const layout = [
    { x: 360, y: 470, r: -13 }, { x: 760, y: 400, r: 8 }, { x: 1180, y: 500, r: -5 },
    { x: 600, y: 660, r: 15 }, { x: 1500, y: 372, r: -19 },
  ];

  return function (t) {
    const local = t - 5.5;
    hc.forEach((n, i) => {
      const k = eOut(seg(t, 5.7 + i * .06, 6.3 + i * .06));
      setT(n, { o: k, y: (1 - k) * 26, b: (1 - k) * 10 });
    });
    setT(eb, { o: seg(t, 5.6, 6.1) });

    const inK = seg(local, .35, 1.5);
    nodes.forEach((n, i) => {
      const k = eBack(seg(local, .35 + i * .13, 1.35 + i * .13));
      const L = layout[i];
      // drift outward slowly, jitter when the "links" break
      const shake = sstep(6.2, 6.9, local) * (1 - sstep(7.2, 7.9, local));
      const jx = shake ? Math.sin(local * 34 + i) * 9 * shake : 0;
      const jy = shake ? Math.cos(local * 29 + i * 2) * 7 * shake : 0;
      setT(n, {
        o: k * (1 - sstep(7.0, 7.6, local) * .0),
        x: lerp(960, L.x, k) + jx,
        y: lerp(560, L.y, k) + jy,
        r: lerp(0, L.r, k),
        s: lerp(.5, 1, k),
      });
    });

    // lines draw then snap red
    const draw = eOut(seg(local, 1.5, 2.6));
    const broken = sstep(6.2, 6.8, local);
    nodes.forEach((n, i) => {
      if (i >= nodes.length - 1) return;
      const a = nodes[i], b = nodes[i + 1];
      const ax = a.getBoundingClientRect();
      // use layout numbers (transform already applied) — recompute from current t
      const pa = currentPos(i, local), pb = currentPos(i + 1, local);
      const l = lines[i];
      l.setAttribute('x1', pa.x + 118); l.setAttribute('y1', pa.y + 56);
      l.setAttribute('x2', pa.x + 118 + (pb.x - pa.x) * draw);
      l.setAttribute('y2', pa.y + 56 + (pb.y - pa.y) * draw);
      l.setAttribute('stroke', broken > .5 ? 'rgba(244,135,113,.55)' : 'rgba(157,144,122,.42)');
      l.setAttribute('stroke-width', 1.5);
      l.setAttribute('opacity', (.55 * draw * (1 - sstep(6.4, 7.1, local))).toFixed(3));
    });

    stats.forEach((n, i) => {
      const k = eOut(seg(local, 3.0 + i * .18, 3.7 + i * .18));
      setT(n, { o: k, y: (1 - k) * 20, b: (1 - k) * 6 });
    });
    setT(verdict, { o: seg(local, 4.0, 4.7), y: (1 - eOut(seg(local, 4.0, 4.7))) * 18 });

    // everything snaps apart at the very end
    const blow = sstep(6.6, 7.0, local);
    if (blow > 0) {
      nodes.forEach((n, i) => {
        const s = mulberry32(500 + i);
        const dx = (s() - .5) * 1900, dy = (s() - .5) * 900;
        const cur = currentPos(i, local);
        const curR = parseFloat((n.style.transform.match(/rotate\(([-\d.]+)deg\)/) || [0, 0])[1]) || 0;
        n.style.transform = `translate3d(${cur.x + dx * blow}px,${cur.y + dy * blow}px,0) rotate(${curR + (s() - .5) * 160 * blow}deg)`;
      });
    }
  };

  function currentPos(i, local) {
    const k = eBack(seg(local, .35 + i * .13, 1.35 + i * .13));
    const L = layout[i];
    return { x: lerp(960, L.x, k), y: lerp(560, L.y, k) };
  }
})();

/* ---------- S3 · REVEAL  12.0 → 18.0 ---------- */
const reveal = (() => {
  const root = $('#s-reveal');
  const eb = el('div', 'eyebrow', 'THE WORKBENCH');
  eb.style.cssText = 'position:absolute;left:150px;top:196px';
  const h = el('div', 'h2');
  h.style.cssText = 'position:absolute;left:150px;top:236px;font-size:66px';
  h.innerHTML = `一个工作台<br><span class="gold">五条主线</span>`;
  const lede = el('div', 'lede');
  lede.style.cssText = 'position:absolute;left:150px;top:412px;width:420px;font-size:22px';
  lede.innerHTML = '对话、学习、资料、训练、设置——<br>围绕同一个学习者，同一份上下文。';
  root.append(eb, h, lede);

  const views = [
    { id: 'coach', label: '对话', en: 'Coach', shot: 'shots/coach-rich.png' },
    { id: 'plan', label: '学习', en: 'Plan', shot: 'shots/plan-ready.png' },
    { id: 'res', label: '资料', en: 'Resources', shot: 'shots/res-preview.png' },
    { id: 'train', label: '训练', en: 'Training', shot: 'shots/train-fn.png' },

  loopBar.style.cssText = 'position:absolute;left:1120px;top:722px;height:2px;width:0;background:linear-gradient(90deg,var(--gold),var(--teal));box-shadow:0 0 20px rgba(217,178,115,.6)';

    setT(win, { o: k, x: lerp(-620, 470, k), y: lerp(120, 250, k), s: lerp(.94, 1, k), b: (1 - k) * 12, rx: lerp(5, 0, k) });

    // tool chain steps
    stepNodes.forEach((n, i) => {
      const kk = eOut(seg(local, 1.4 + i * .42, 2.3 + i * .42));
      setT(n, { o: kk, x: (1 - kk) * -26, s: lerp(.94, 1, kk) });
    });

    // loop bar fills as steps complete, then repeats once
    const loop = seg(local, 1.5, 3.4);
    const rep = (local - 4.4) / 2.4;
    const rr = rep >= 0 ? (rep % 1) : 0;
    const useRep = rep >= 0;
    const lv = useRep ? rr : loop;
    loopBar.style.width = (clamp01(lv) * 600).toFixed(1) + 'px';
    loopTxt.textContent = useRep
      ? `循环 ${Math.floor(rep) + 2} · turn ${3 + Math.floor(rep)} · 工具 ${Math.min(6, 2 + Math.floor(rep) * 2)} 次`
      : '循环 1 · turn 3 · 思考 → 工具 → 观察 → 回答';

    // streaming type-on
    const flat = STREAM.replace(/<[^>]+>/g, '');
    const total = flat.length;
    const tk = useRep ? clamp01((rr - .45) / .4) : clamp01((local - 4.6) / 1.5);
    // rebuild with markup, cutting at tk
    const idx = Math.floor(tk * total);
    stream.innerHTML = sliceMarkup(STREAM, idx) + (tk > .96 ? '<span class="caret"></span>' : '');
    setT(stream, { o: useRep ? clamp01((rr - .4) / .1) : clamp01((local - 4.5) / .4) });
  };

  function sliceMarkup(s, n) {
    let out = '', count = 0, open = false;
    for (let i = 0; i < s.length; i++) {
      const c = s[i];
      if (c === '<') { out += c; if (s[i + 1] !== '/') open = true; continue; }
      if (c === '>') { out += c; if (s[i - 1] !== '/') open = false; continue; }
      if (open) { out += c; continue; }
      if (count >= n) break;
      out += c; count++;
    }
    return out;
  }
})();

    c.innerHTML = `<div style="font-size:11px;color:#6b6762;font-family:var(--mono)">CARD</div>
                   <div style="font-size:15px;color:#ddd8d2;font-weight:600">${lab}</div>`;
    root.appendChild(c); return c;
  });

  return function (t) {
    const local = t - 37.0;
    setT(eb, { o: seg(t, 37.1, 37.6) });
    setT(h, { o: seg(t, 37.2, 37.9), y: (1 - eOut(seg(t, 37.2, 37.9))) * 24 });
    setT(lede, { o: seg(t, 38.0, 38.6), y: (1 - eOut(seg(t, 38.0, 38.6))) * 18 });
    const k = eExpo(seg(local, .1, 1.3));
    setT(win, { o: k, x: lerp(700, 1246, k), y: lerp(200, 258, k), s: lerp(.92, 1, k), b: (1 - k) * 12, rx: lerp(6, 0, k) });

    // curve draws
    const dk = eOut(seg(local, 1.2, 3.4));
    const curve = svg.querySelector('#curve'), fill = svg.querySelector('#curveFill'), dot = svg.querySelector('#dot');
    const total = curve.getTotalLength ? curve.getTotalLength() : 2000;
    curve.style.strokeDasharray = total;
    curve.style.strokeDashoffset = total * (1 - dk);
    const nFill = Math.floor(dk * (pts.length));
    fill.setAttribute('d', 'M' + pts.slice(0, Math.max(2, nFill)).map(p => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' L') + ` L${(pts[Math.max(1, nFill - 1)] || [0, 400])[0].toFixed(1)},400 L0,400 Z`);
    fill.style.opacity = clamp01((dk - .25) / .5);
    const pAt = pts[Math.min(pts.length - 1, nFill)];
    dot.setAttribute('cx', pAt[0]); dot.setAttribute('cy', pAt[1]);
    dot.setAttribute('opacity', clamp01((dk - .1) / .3) * (Math.floor(local * 3) % 4 === 0 ? .25 : 1));

    marks.forEach((g, i) => {
      const kk = eOut(seg(local, 2.6 + i * .3, 3.3 + i * .3));
      g.setAttribute('opacity', kk.toFixed(3));
    });

    // cards fly from the window into the curve slots
    cardNodes.forEach((c, i) => {
      const f = intervals[i][1];
      const tx = 150 + f * 900 - 46, ty = 492 + pts[Math.round(f * 120)][1] - 63;
      const kk = eBack(seg(local, 3.4 + i * .26, 4.5 + i * .26));
      const sx = 1246 + 200, sy = 258 + 200;
      setT(c, {
        o: kk,
        x: lerp(sx, tx, kk), y: lerp(sy, ty, kk),
        s: lerp(.9, .78, kk), r: lerp(0, i % 2 ? 8 : -8, kk),
        b: (1 - kk) * 6,
      });
    });
  };
})();

/* ---------- S8 · ARCHITECTURE  44.5 → 53.0 ---------- */
const archScene = (() => {
  const root = $('#s-arch');
  const eb = el('div', 'eyebrow', 'ARCHITECTURE');
  eb.style.cssText = 'position:absolute;left:160px;top:150px';
  const h = el('div', 'h2');
  h.style.cssText = 'position:absolute;left:160px;top:190px;font-size:58px';
  h.innerHTML = `<span class="gold">本地大脑</span> <span style="color:#5a5652">/</span> 远端双手`;
  root.append(eb, h);

  const nodes = [
    { id: 'host', x: 160, y: 400, w: 380, h: 190, c: '#d9b273', t: 'VS Code 宿主', s: 'Trainer Extension · UI Host' },
    { id: 'sidecar', x: 660, y: 380, w: 360, h: 230, c: '#4ec9b0', t: 'FastAPI Sidecar', s: 'ReAct 循环 · 教学决策 · 评估' },
    { id: 'store', x: 660, y: 676, w: 360, h: 130, c: '#9d907a', t: 'SQLite + Qdrant', s: '记忆 · 计划 · 语义检索' },
    { id: 'remote', x: 1140, y: 400, w: 380, h: 190, c: '#8b7cf6', t: '远端 Companion', s: 'Remote FS · 搜索 · 诊断 · 校验' },
    { id: 'prov', x: 1140, y: 676, w: 380, h: 130, c: '#8a857f', t: 'Provider API', s: 'OpenAI 兼容 · 密钥留在宿主' },
  ];
  const map = {};
  nodes.forEach(n => {
    const d = el('div', 'card');
    d.style.cssText = `left:${n.x}px;top:${n.y}px;width:${n.w}px;height:${n.h}px;padding:24px 26px;opacity:0;border-color:${n.c}3a`;
    d.innerHTML = `<div style="display:flex;align-items:center;gap:10px">
        <div style="width:8px;height:8px;border-radius:50%;background:${n.c};box-shadow:0 0 14px ${n.c}"></div>
        <div style="font-size:27px;font-weight:700;color:#eae6e0;letter-spacing:-.01em">${n.t}</div></div>
      <div class="mono" style="font-size:15px;color:#7d7873;margin-top:12px;letter-spacing:-.01em">${n.s}</div>`;
    root.appendChild(d); map[n.id] = d;
  });

  // secret lock badge on the host
  const lock = el('div', 'card');
  lock.style.cssText = 'left:0;top:0;width:300px;height:70px;padding:12px 18px;opacity:0;border-color:rgba(244,135,113,.4);display:flex;align-items:center;gap:12px';
  lock.innerHTML = `<div style="color:var(--rose);font-size:22px">🔒</div>
    <div><div style="font-size:16px;color:#f0d6d0">API Key 不出宿主</div>
    <div class="mono" style="font-size:12px;color:#a2705f;margin-top:3px">SecretStorage · ui_proxy</div></div>`;
  root.appendChild(lock);

  // packet paths
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('width', W); svg.setAttribute('height', H);
  svg.style.cssText = 'position:absolute;inset:0';
  root.appendChild(svg);
  const NS = 'http://www.w3.org/2000/svg';
  const links = [];
  function link(a, b, c) {
    const l = document.createElementNS(NS, 'line');
    l.setAttribute('stroke', c); l.setAttribute('stroke-width', 1.6);
    l.setAttribute('stroke-dasharray', '6 8');
    l.setAttribute('opacity', '0');
    svg.appendChild(l); links.push({ l, a, b }); return l;
  }
  const l1 = link('host', 'sidecar', 'rgba(217,178,115,.5)');
  const l2 = link('sidecar', 'store', 'rgba(157,144,122,.5)');
  const l3 = link('sidecar', 'remote', 'rgba(139,124,246,.5)');
  const l4 = link('sidecar', 'prov', 'rgba(138,133,127,.45)');

  const packets = [];
  for (let i = 0; i < 10; i++) {
    const p = document.createElementNS(NS, 'circle');
    p.setAttribute('r', '4'); p.setAttribute('opacity', '0');
    svg.appendChild(p); packets.push({ p, li: i % 4, ph: (i / 10) });
  }

  const cap = el('div', 'lede');
  cap.style.cssText = 'position:absolute;left:160px;top:872px;width:1000px;font-size:22px;opacity:0';
  cap.textContent = '身份、记忆、计划、证据留在本地；远端只伸手去够代码。';
  root.appendChild(cap);

  const anchor = { host: [540, 495], sidecar: [840, 495], store: [840, 676], remote: [1140, 495], prov: [1140, 741] };

  return function (t) {
    const local = t - 44.5;
    setT(eb, { o: seg(t, 44.6, 45.1) });
    setT(h, { o: seg(t, 44.7, 45.4), y: (1 - eOut(seg(t, 44.7, 45.4))) * 22 });

    nodes.forEach((n, i) => {
      const kk = eBack(seg(local, .3 + i * .17, 1.4 + i * .17));
      setT(map[n.id], { o: kk, y: lerp(0, 0, kk) + (1 - kk) * 26, s: lerp(.92, 1, kk), b: (1 - kk) * 10 });
    });
    const lk = eOut(seg(local, 1.4, 2.6));
    setT(lock, { o: sstep(2.2, 2.7, local), x: lerp(560, 620, lk), y: 618, s: lerp(.96, 1, lk) });

    const lset = [l1, l2, l3, l4];
    lset.forEach((l, i) => {
      const kk = eOut(seg(local, 1.3 + i * .18, 2.4 + i * .18));
      const a = anchor[nodes[i].id], b = anchor[nodes[i + 1].id];
      l.setAttribute('x1', a[0]); l.setAttribute('y1', a[1]);
      l.setAttribute('x2', lerp(a[0], b[0], kk)); l.setAttribute('y2', lerp(a[1], b[1], kk));
      l.setAttribute('opacity', (kk * .9).toFixed(3));
    });

    const flow = clamp01((local - 2.2) / 1.2);
    packets.forEach(({ p, li, ph }) => {
      const prog = ((local * .38 + ph) % 1);
      const a = anchor[nodes[li].id], b = anchor[nodes[li + 1].id];
      p.setAttribute('cx', lerp(a[0], b[0], prog));
      p.setAttribute('cy', lerp(a[1], b[1], prog) + Math.sin(prog * Math.PI) * -18);
      const cols = ['#d9b273', '#9d907a', '#8b7cf6', '#8a857f'];
      p.setAttribute('fill', cols[li]);
      p.setAttribute('opacity', (flow * Math.sin(prog * Math.PI) * .95).toFixed(3));
    });

    setT(cap, { o: seg(local, 3.4, 4.2), y: (1 - eOut(seg(local, 3.4, 4.2))) * 18 });
  };
})();

/* ---------- S9 · SCALE  53.0 → 57.0 ---------- */
const scaleScene = (() => {
  const root = $('#s-scale');
  const eb = el('div', 'eyebrow', 'BY THE NUMBERS');
  eb.style.cssText = 'position:absolute;left:960px;top:280px;transform:translateX(-50%)';
  const tiles = [
    ['5', '视图', 'views'],
    ['8', '语言', 'locales'],
    ['376', '测试文件', 'node --test + pytest'],
    ['25.5k', '行', 'routers.py'],
    ['245', 'MB', '随包 sidecar'],
  ];
  const nodes = tiles.map(([v, l, s], i) => {
    const c = el('div', 'card');
    c.style.cssText = `width:296px;height:230px;padding:30px 30px;opacity:0`;
    c.innerHTML = `<div class="mono" style="font-size:66px;font-weight:700;color:#eae6e0;line-height:1;letter-spacing:-.03em">
        <span class="num" data-v="${v}">0</span></div>
      <div style="font-size:24px;font-weight:650;color:#b9b4ac;margin-top:18px">${l}</div>

    root.appendChild(c); return { c, v, i };
  });
  root.appendChild(eb);
  return function (t) {
    const local = t - 53.0;
    setT(eb, { o: seg(t, 53.1, 53.6) });
    nodes.forEach(({ c, v, i }) => {
      const kk = eBack(seg(local, .25 + i * .16, 1.3 + i * .16));
      const x = 960 + (i - 2) * 322;
      setT(c, { o: kk, x, y: lerp(420, 420, kk) + (1 - kk) * 40, s: lerp(.9, 1, kk), b: (1 - kk) * 12 });
      const num = c.querySelector('.num');
      const target = parseFloat(v);
      const cur = target * eOut(clamp01((local - (.55 + i * .16)) / 1.1));
      num.textContent = v.includes('k') ? (cur / 1000).toFixed(1) + 'k' : String(Math.round(cur));
    });
  };
})();

/* ---------- S10 · OUTRO  57.0 → 62.0 ---------- */
const outro = (() => {
  const root = $('#s-outro');
  const svg = document.createElementNS(NS_PLACEHOLDER, 'svg');
  const NSU = 'http://www.w3.org/2000/svg';
  root.innerHTML = `
  <svg viewBox="0 0 120 120" width="188" height="188" id="mark" style="position:absolute;left:960px;top:322px;transform:translateX(-50%)">
    <g fill="none" stroke="#d9b273" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path id="p1" d="M30 15h40a10 10 0 0 1 10 10v42"/>
      <path id="p2" d="M30 15a10 10 0 0 0-10 10v62l16-13h32a10 10 0 0 0 10-10"/>
      <path id="p3" d="M60 39 67 58 86 65 67 72 60 91 53 72 34 65 53 58z"/>
    </g>
    <circle id="markdot" cx="60" cy="65" r="4" fill="#d9b273" opacity="0"/>
  </svg>`;
  const word = el('div', 'h1');
  word.style.cssText = 'position:absolute;left:960px;top:498px;transform:translateX(-50%);font-size:104px';
  word.textContent = 'TRAINER';

  const sub = el('div', 'lede mono');

  sub.textContent = 'VS CODE EXTENSION  ·  PYTHON SIDECAR  ·  FSRS  ·  8 LANGUAGES';
  root.append(word, tag, sub);

  const strip = el('div', '');
  strip.style.cssText = 'position:absolute;left:960px;top:812px;transform:translateX(-50%);display:flex;gap:16px';
  root.appendChild(strip);
  const chips = [['对话', 'Coach'], ['学习', 'Plan'], ['资料', 'Resources'], ['训练', 'Training'], ['设置', 'Settings']]
    .map(([a, b]) => {
      const c = el('div', 'chip');
      c.style.opacity = 0;
      c.innerHTML = `<div class="dot"></div><div><span style="color:#ddd8d2;font-weight:600">${a}</span>
        <span class="mono" style="color:#6b6762;font-size:12.5px;margin-left:8px;letter-spacing:.08em">${b.toUpperCase()}</span></div>`;
      strip.appendChild(c); return c;
    });

  const paths = ['p1', 'p2', 'p3'].map(id => root.querySelector('#' + id));
  return function (t) {
    const local = t - 57.0;
    paths.forEach((p, i) => {
      const kk = eOut(seg(local, .1 + i * .22, 1.1 + i * .22));
      const L = p.getTotalLength();
      p.style.strokeDasharray = L; p.style.strokeDashoffset = L * (1 - kk);
    });
    const kd = eOut(seg(local, 1.0, 1.5));
    root.querySelector('#markdot').setAttribute('opacity', (kd * (Math.floor(local * 2.5) % 2 ? .35 : 1)).toFixed(2));
    root.querySelector('#mark').setAttribute('transform', `rotate(${(1 - kd) * -90} 60 65)`);

    const kw = eExpo(seg(local, .8, 1.7));
    setT(word, { o: kw, y: (1 - kw) * 30, b: (1 - kw) * 14, s: lerp(.95, 1, kw) });
    setT(tag, { o: eOut(seg(local, 1.7, 2.5)), y: (1 - eOut(seg(local, 1.7, 2.5))) * 20 });
    setT(sub, { o: seg(local, 2.1, 2.9) });
    chips.forEach((c, i) => {
      const kk = eBack(seg(local, 2.5 + i * .13, 3.2 + i * .13));
      setT(c, { o: kk, y: (1 - kk) * 22, s: lerp(.9, 1, kk) });
    });
  };
})();

/* =======================================================================
   MASTER RENDER
   ======================================================================= */
const SCENES = [
  { el: $('#s-boot'), t0: 0, t1: 5.5, fn: boot },
  { el: $('#s-problem'), t0: 5.5, t1: 12.0, fn: problem },
  { el: $('#s-reveal'), t0: 12.0, t1: 18.0, fn: reveal },
  { el: $('#s-coach'), t0: 18.0, t1: 26.0, fn: coachScene },
  { el: $('#s-plan'), t0: 26.0, t1: 32.0, fn: planScene },
  { el: $('#s-res'), t0: 32.0, t1: 37.0, fn: resScene },
  { el: $('#s-train'), t0: 37.0, t1: 44.5, fn: trainScene },
  { el: $('#s-arch'), t0: 44.5, t1: 53.0, fn: archScene },
  { el: $('#s-scale'), t0: 53.0, t1: 57.0, fn: scaleScene },
  { el: $('#s-outro'), t0: 57.0, t1: 62.0, fn: outro },
];
const FADE = .42;

const aur = [$('#aur1'), $('#aur2'), $('#aur3')];
aur[0].style.cssText = 'left:2%;top:-14%;width:900px;height:900px;background:radial-gradient(closest-side,rgba(217,178,115,.30),transparent)';
aur[1].style.cssText = 'left:56%;top:38%;width:1050px;height:1050px;background:radial-gradient(closest-side,rgba(78,201,176,.20),transparent)';
aur[2].style.cssText = 'left:24%;top:44%;width:1000px;height:1000px;background:radial-gradient(closest-side,rgba(139,124,246,.17),transparent)';

function render(t) {
  // aurora drift
  aur.forEach((n, i) => {
    const sp = [.10, -.075, .055][i];
    const px = Math.sin(t * sp + i * 2.1) * 130;
    const py = Math.cos(t * sp * .8 + i * 1.3) * 90;
    const sc = 1 + .18 * Math.sin(t * .16 + i);
    n.style.transform = `translate3d(${px}px,${py}px,0) scale(${sc.toFixed(3)})`;
  });

  let fieldK = .55;
  SCENES.forEach(s => {
    const vis = clamp01((t - s.t0) / FADE) * (1 - clamp01((t - (s.t1 - FADE)) / FADE));
    if (vis <= 0) { s.el.style.opacity = 0; return; }
    s.el.style.opacity = vis.toFixed(4);
    s.el.style.pointerEvents = 'none';
    s.fn(t);
  });
  // deepen the field on the calmer beats
  if (t > 12 && t < 18) fieldK = .8;
  if (t >= 44.5 && t < 53) fieldK = .4;
  if (t >= 53) fieldK = .7;
  drawField(t, fieldK);
}

window.__seek = t => { render(t); };
window.__duration = DURATION;
window.__fps = FPS;

window.__ready = (async () => {
  const imgs = Array.from(document.images);
  await Promise.all(imgs.map(i => i.complete ? Promise.resolve() : new Promise(res => {
    i.addEventListener('load', res); i.addEventListener('error', res);
  })));
  await document.fonts.ready;
  render(0);
  return true;
})();
</script>
